  <main>
    <h1>Inscription</h1>

    <article>
      <p id="erreur"></p>
      <form action="traitementInscription.php" method="post">

        <div class="form-group">
          <label for="CLI_NOM">Nom</label>
          <input type="text" id="CLI_NOM" name="CLI_NOM" placeholder="Votre nom" required>
        </div>

        <div class="form-group">
          <label for="CLI_PRENOM">Prénom</label>
          <input type="text" id="CLI_PRENOM" name="CLI_PRENOM" placeholder="Votre prénom" required>
        </div>

        <div class="form-group">
          <label for="CLI_COURRIEL">Email</label>
          <input type="email" id="CLI_COURRIEL" name="CLI_COURRIEL" placeholder="votre@email.fr" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="CLI_MDP">Mot de passe</label>
            <input type="password" id="CLI_MDP" name="CLI_MDP" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label for="CLI_MDP_CONF">Confirmer le mot de passe</label>
            <input type="password" id="CLI_MDP_CONF" name="CLI_MDP_CONF" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="CLI_VILLE">Ville</label>
            <input type="text" id="CLI_VILLE" name="CLI_VILLE" placeholder="Votre ville" required>
          </div>
          <div class="form-group">
            <label for="CLI_TELEPHONE">Téléphone</label>
            <input type="tel" id="CLI_TELEPHONE" name="CLI_TELEPHONE" placeholder="06 00 00 00 00" required>
          </div>
        </div>

        <div class="form-group">
          <label for="DEP_NUM">Département</label>
          <select id="DEP_NUM" name="DEP_NUM" required>
            <option value="">Sélectionnez votre département</option>
            <option value="14">14 – Calvados</option>
            <option value="50">50 – Manche</option>
            <option value="61">61 – Orne</option>
            <option value="27">27 – Eure</option>
            <option value="76">76 – Seine-Maritime</option>
          </select>
        </div>

        <button type="submit">S'inscrire</button>
      </form>
    </article>
  </main>
