<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<title>inscription Viking Transport</title>
        <link rel="stylesheet" href="style.css">
	</head>
	<body>
        <h1>Inscription</h1>

        <p id="erreur"> </p>
        <form action="traitementInscription.php" method="post">
            <label for="CLI_NOM">Nom :</label>
            <input type="text" id="CLI_NOM" name="CLI_NOM" required><br><br>

            <label for="CLI_PRENOM">Prénom :</label>
            <input type="text" id="CLI_PRENOM" name="CLI_PRENOM" required><br><br>

            <label for="CLI_COURRIEL">Email :</label>
            <input type="email" id="CLI_COURRIEL" name="CLI_COURRIEL" required><br><br>

            <label for="CLI_MDP">Mot de passe :</label>
            <input type="password" id="CLI_MDP" name="CLI_MDP" required><br><br>

            <label for="CLI_MDP_CONF">Confirmer le mot de passe :</label>
            <input type="password" id="CLI_MDP_CONF" name="CLI_MDP_CONF" required><br><br>

            <label for="CLI_VILLE">Ville :</label>
            <input type="text" id="CLI_VILLE" name="CLI_VILLE" required><br><br>

            <label for="CLI_TELEPHONE">Téléphone :</label>
            <input type="tel" id="CLI_TELEPHONE" name="CLI_TELEPHONE" required><br><br>

            <label for="DEP_NUM">Département :</label>
            <select id="DEP_NUM" name="DEP_NUM" required>
                <option value="">Sélectionnez votre département </option>
                <option value="14">14  Calvados</option>
                <option value="50">50  Manche</option>
                <option value="61">61  Orne</option>
                <option value="27">27  Eure</option>
                <option value="76">76  Seine-Maritime</option>
            </select><br><br>

            <input type="submit" value="S'inscrire">
        </form>

	</body>
</html>
